name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-package-release:
    name: Test, package, and release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic versioning, for example v1.0.0."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore Benita.sln

      - name: Build solution
        run: dotnet build Benita.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Benita.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Publish platform packages
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p artifacts

          for runtime in win-x64 linux-x64 osx-x64; do
            output="publish/$runtime"
            dotnet publish Benita/Benita.csproj \
              --configuration Release \
              --runtime "$runtime" \
              --self-contained true \
              --output "$output" \
              -p:Version="$version" \
              -p:PublishSingleFile=true \
              -p:DebugType=None \
              -p:DebugSymbols=false

            if [[ "$runtime" == "win-x64" ]]; then
              (cd "$output" && zip -r "../../artifacts/Benita-$RELEASE_TAG-$runtime.zip" .)
            else
              tar -C "$output" -czf "artifacts/Benita-$RELEASE_TAG-$runtime.tar.gz" .
            fi
          done

      - name: Create GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --verify-tag \
              --title "Benita $RELEASE_TAG" \
              --generate-notes
          fi
